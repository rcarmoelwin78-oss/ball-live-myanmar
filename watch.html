<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ball Live Myanmar</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
  <style>:root{--green:#31dc82;--muted:#9ba8a1}*{box-sizing:border-box}body{margin:0;background:#090d0b;color:#eef4f0;font-family:"Segoe UI",Arial,sans-serif}.wrap{max-width:650px;min-height:100vh;margin:auto;padding:20px 16px}.back{border:0;background:none;color:var(--green);font:700 14px inherit;cursor:pointer}.league{margin-top:25px;color:var(--green);font-size:11px;font-weight:800;letter-spacing:1px}.title{margin:6px 0 17px;font-size:21px}.player{position:relative;overflow:hidden;aspect-ratio:16/9;border:1px solid rgba(255,255,255,.1);border-radius:17px;background:#000}.player iframe,.player video{width:100%;height:100%;border:0;background:#000}.loading{position:absolute;inset:0;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.7);color:#cbd5cf;text-align:center;font-size:13px;line-height:1.6}.note{margin-top:15px;padding:14px;border-radius:13px;background:#151c19;color:var(--muted);font-size:12px;line-height:1.55}.source{color:var(--green);font-weight:800}</style>
</head>
<body><main class="wrap"><button class="back" onclick="location.href='index.html'">← Live matches</button><div class="league" id="league">LIVE EVENT</div><h1 class="title" id="title">Loading match…</h1><div class="player" id="player"><div class="loading" id="loading">Live stream ကို ပြင်ဆင်နေပါသည်…</div></div><p class="note"><span class="source">Authorized provider stream.</span> Connection မကောင်းလျှင် ခဏစောင့်ပြီး refresh ပြန်လုပ်ပါ။</p></main><script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();tg.BackButton.show();tg.BackButton.onClick(()=>location.href='index.html')}const id=Number(new URLSearchParams(location.search).get('id')),player=document.getElementById('player'),loading=document.getElementById('loading');function error(t){loading.textContent=t;loading.style.display='grid'}function youtubeId(v){if(!v)return '';if(/^[\w-]{11}$/.test(v))return v;try{const u=new URL(v);return u.hostname.includes('youtu.be')?u.pathname.slice(1).split('/')[0]:u.searchParams.get('v')||u.pathname.split('/').filter(Boolean).pop()||''}catch{return ''}}function youtube(v){const x=youtubeId(v);if(!x)return error('YouTube link မမှန်ပါ။');const f=document.createElement('iframe');f.src=`https://www.youtube-nocookie.com/embed/${encodeURIComponent(x)}?autoplay=1&playsinline=1`;f.allow='autoplay; encrypted-media; picture-in-picture';f.allowFullscreen=true;loading.remove();player.appendChild(f)}function hls(url){const v=document.createElement('video');v.controls=true;v.playsInline=true;player.appendChild(v);if(window.Hls&&Hls.isSupported()){const h=new Hls({enableWorker:true,lowLatencyMode:true});h.loadSource(url);h.attachMedia(v);h.on(Hls.Events.MANIFEST_PARSED,()=>{loading.remove();v.play().catch(()=>{})});h.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal)error('Provider stream ကို မဖွင့်နိုင်သေးပါ။')})}else if(v.canPlayType('application/vnd.apple.mpegurl')){v.src=url;v.onloadedmetadata=()=>loading.remove();}else error('ဒီ browser မှာ HLS stream မရပါ။')}async function load(){if(!id)return error('မမှန်ကန်သော match link ပါ။');try{const [a,b]=await Promise.all([fetch('/api/matches'),fetch(`/api/resolve/${id}`)]);const ms=await a.json(),m=ms.find(x=>Number(x.id)===id),s=await b.json();if(!m||!b.ok)throw Error(s.error||'Match not found');document.getElementById('title').textContent=m.away?`${m.home} vs ${m.away}`:m.home;document.getElementById('league').textContent=m.league||'FOOTBALL LIVE';if(s.type==='youtube')youtube(s.youtube);else if(s.type==='hls')hls(s.streamUrl);else error('Playable stream မရသေးပါ။')}catch(e){error(e.message||'Match data မရသေးပါ။')}}load();
</script></body></html>
