<!doctype html>
<html lang="my"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ball Live Admin</title>
<style>body{margin:0;background:#090d0b;color:#edf5ef;font:15px Arial,sans-serif}.app{max-width:560px;margin:auto;padding:28px 16px}.card{margin-top:18px;padding:18px;border:1px solid #ffffff1a;border-radius:16px;background:#151d19}input,button{box-sizing:border-box;width:100%;padding:13px;margin-top:10px;border-radius:10px;font:inherit}input{border:1px solid #ffffff22;background:#0d120f;color:#fff}button{border:0;background:#31dc82;color:#052012;font-weight:800;cursor:pointer}.user{margin-top:12px;padding:12px;border-radius:12px;background:#101713}.muted{color:#9ba8a1;font-size:13px}.ok{color:#31dc82}</style>
<main class="app"><b class="ok">BALL LIVE MYANMAR</b><h1>Payment စစ်ရန်</h1><section class="card"><label>Admin secret</label><input id="token" type="password" placeholder="ADMIN_API_TOKEN"><button onclick="connectBot()">Bot ကိုချိတ်မည် (တစ်ကြိမ်သာ)</button><button onclick="loadUsers()">Payment users ကိုကြည့်မည်</button><div id="users"></div></section></main>
<script>const api='https://raoxttvjybufllnddupi.supabase.co/functions/v1/ball-api',token=document.querySelector('#token'),users=document.querySelector('#users');function call(action,body={}){return fetch(api,{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+token.value},body:JSON.stringify({action,...body})}).then(async r=>{let d=await r.json();if(!r.ok)throw Error(d.error);return d})}async function connectBot(){try{await call('configure_bot');alert('Bot ချိတ်ပြီးပါပြီ')}catch(e){alert(e.message)}}async function loadUsers(){try{let list=await call('users');users.innerHTML=list.length?list.map(u=>`<div class="user"><b>${u.display_name||'Telegram user'}</b><div class="muted">${u.telegram_user_id}</div><p>${u.message_type==='photo'?'📷 Screenshot ပို့ထားသည်':u.latest_message||'စာမရှိပါ'}</p><button onclick="activate('${u.telegram_user_id}','${(u.display_name||'').replaceAll("'",'')}')">Activate 30 days</button></div>`).join(''):'<p class="muted">User မရှိသေးပါ</p>'}catch(e){alert(e.message)}}async function activate(id,name){try{let d=await call('activate',{telegramUserId:id,displayName:name,days:30});alert(d.delivery);loadUsers()}catch(e){alert(e.message)}}</script>
