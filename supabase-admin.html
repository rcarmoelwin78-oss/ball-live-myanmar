<!doctype html>
<html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ball Live Admin</title>
<style>
body{margin:0;background:#090d0b;color:#edf5ef;font:15px Arial,sans-serif}.app{max-width:620px;margin:auto;padding:28px 16px}.card{margin-top:18px;padding:18px;border:1px solid #ffffff1a;border-radius:16px;background:#151d19}input,select,button{box-sizing:border-box;width:100%;padding:13px;margin-top:9px;border-radius:10px;font:inherit}input,select{border:1px solid #ffffff22;background:#0d120f;color:#fff}button{border:0;background:#31dc82;color:#052012;font-weight:800;cursor:pointer}.user,.match{margin-top:12px;padding:12px;border-radius:12px;background:#101713}.muted{color:#9ba8a1;font-size:13px}.ok{color:#31dc82}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stop{background:#ff6f7c;color:#260208}
</style></head>
<body><main class="app"><b class="ok">BALL LIVE MYANMAR</b><h1>Admin Panel</h1>
<section class="card"><label>Admin password</label><input id="token" type="password" placeholder="ကိုယ်သတ်မှတ်ထားတဲ့ password"><button onclick="connectBot()">Bot ကိုချိတ်မည် (တစ်ကြိမ်သာ)</button></section>
<section class="card"><h2>Live match ထည့်ရန်</h2><p class="muted">အသင်းကို list ကနေရွေးပြီး provider link ထည့်ကာ Publish နှိပ်ပါ။ Logo အလိုအလျောက်ပါလာမယ်။</p><label>League</label><input id="league" value="Premier League" placeholder="Premier League"><div class="row"><div><label>Team 1</label><select id="home"></select></div><div><label>Team 2</label><select id="away"></select></div></div><label>Provider stream link</label><input id="stream" placeholder="https://provider.example/live.m3u8"><div class="row"><div><label>Stream type</label><select id="type"><option value="hls">HLS (.m3u8)</option><option value="youtube">YouTube</option></select></div><div><label>Live label</label><input id="time" value="LIVE NOW"></div></div><button onclick="publishMatch()">Publish live match</button><div id="publishStatus" class="muted"></div></section>
<section class="card"><h2>Live matches</h2><button onclick="loadMatches()">Match list refresh</button><div id="matches"></div></section>
<section class="card"><h2>Payment users</h2><button onclick="loadUsers()">Payment users ကိုကြည့်မည်</button><div id="users"></div></section></main>
<script src="team-catalog.js"></script><script>
const api='https://raoxttvjybufllnddupi.supabase.co/functions/v1/ball-api',token=document.querySelector('#token'),users=document.querySelector('#users'),matches=document.querySelector('#matches'),catalog=window.BALL_TEAMS||[];
const esc=v=>{const e=document.createElement('span');e.textContent=v||'';return e.innerHTML};
function options(){return '<option value="">အသင်းရွေးပါ</option>'+catalog.map((team,i)=>`<option value="${i}">${team[0]}</option>`).join('')}home.innerHTML=options();away.innerHTML=options();
function call(action,body={}){return fetch(api,{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+token.value},body:JSON.stringify({action,...body})}).then(async r=>{let d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d})}
async function connectBot(){try{await call('configure_bot');alert('Bot ချိတ်ပြီးပါပြီ')}catch(e){alert(e.message)}}
async function publishMatch(){try{const a=catalog[home.value],b=catalog[away.value];if(!a||!b)throw Error('အသင်း ၂ သင်းရွေးပါ');publishStatus.textContent='Publishing…';const d=await call('publish_match',{league:league.value,home:a[0],away:b[0],homeLogo:a[1],awayLogo:b[1],streamUrl:stream.value,time:time.value,streamType:type.value});publishStatus.textContent='✅ Published match ID: '+d.id;stream.value='';loadMatches()}catch(e){publishStatus.textContent='❌ '+e.message}}
async function loadMatches(){try{const list=await call('matches_admin');matches.innerHTML=list.length?list.map(m=>`<div class="match"><b>${esc(m.home)} vs ${esc(m.away)}</b><div class="muted">${esc(m.league)} · ${m.is_live?'🔴 LIVE':'Stopped'}</div><button class="${m.is_live?'stop':''}" onclick="setLive(${m.id},${!m.is_live})">${m.is_live?'Stop live':'Start live'}</button></div>`).join(''):'<p class="muted">Match မရှိသေးပါ</p>'}catch(e){matches.innerHTML='<p>'+esc(e.message)+'</p>'}}
async function setLive(id,isLive){try{await call('set_match_live',{id,isLive});loadMatches()}catch(e){alert(e.message)}}
async function loadUsers(){try{const list=await call('users');users.innerHTML=list.length?list.map(u=>`<div class="user"><b>${esc(u.display_name||'Telegram user')}</b><div class="muted">${esc(u.telegram_user_id)}</div><p>${u.message_type==='photo'?'📷 Screenshot ပို့ထားသည်':esc(u.latest_message||'စာမရှိပါ')}</p><button onclick="activate('${u.telegram_user_id}','${String(u.display_name||'').replaceAll("'",'')}')">Activate 30 days</button></div>`).join(''):'<p class="muted">User မရှိသေးပါ</p>'}catch(e){alert(e.message)}}
async function activate(id,name){try{const d=await call('activate',{telegramUserId:id,displayName:name,days:30});alert(d.delivery);loadUsers()}catch(e){alert(e.message)}}
</script></body></html>
